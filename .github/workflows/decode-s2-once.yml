name: decode-s2-once
on:
  push:
    branches: [main]
    paths: ['_staging_s2/TARBALL.sha256']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Study 2 files, commit, and remove this one-shot workflow
        run: |
          set -euo pipefail
          cd _staging_s2
          cat release.b64.part* | base64 -d > release.tar.gz
          sha256sum -c TARBALL.sha256
          cd ..
          tar -xzf _staging_s2/release.tar.gz
          sha256sum -c _staging_s2/SHA256SUMS
          awk '{print $2}' _staging_s2/SHA256SUMS > /tmp/s2_files.txt
          git rm -r -q _staging_s2
          git rm -q .github/workflows/decode-s2-once.yml
          git config user.name "dixonlj"
          git config user.email "dixonlj1993@gmail.com"
          xargs -a /tmp/s2_files.txt git add --
          git commit -q -m "Study 2: add pre-registration (OSF vrh2u), frozen code, confirmatory results summary, charts, reviews and non-data output tables; README section; gitignore NHSBT data and value-bearing outputs"
          git push
          git show --stat --format='%H' HEAD | tail -5
