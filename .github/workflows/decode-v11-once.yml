name: decode-v11-once
on:
  push:
    branches: [main]
    paths: ['_staging_v11/TARBALL.sha256']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild, verify, unpack and commit the v11 files
        run: |
          set -euo pipefail
          cd _staging_v11
          cat release.b64.part* | base64 -d > release_v11.tar.gz
          sha256sum -c TARBALL.sha256
          cd ..
          tar -xzf _staging_v11/release_v11.tar.gz
          sha256sum -c _staging_v11/SHA256SUMS
          awk '{print $2}' _staging_v11/SHA256SUMS > /tmp/v11_files.txt
          git rm -r -q _staging_v11
          rm -rf _staging_v11
          git config user.name "dixonlj"
          git config user.email "dixonlj1993@gmail.com"
          xargs -a /tmp/v11_files.txt git add -f --
          git commit -q -m "Add draft v11: Research Reviewer's required fixes R1-R6 and R8 (retrospective OSF registration wording, calendar dependence in abstract, Stanford wording, AI-use statement), redrawn figures, number check v11, README reproduce section"
          git push
          git show --stat --format='%H' HEAD | tail -3
