name: decode-v10-once
on:
  push:
    branches: [main]
    paths: ['_staging_v10/TARBALL.sha256']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild, verify, unpack and commit the v10 files
        run: |
          set -euo pipefail
          cd _staging_v10
          cat release.b64.part* | base64 -d > release_v10.tar.gz
          sha256sum -c TARBALL.sha256
          cd ..
          tar -xzf _staging_v10/release_v10.tar.gz
          sha256sum -c _staging_v10/SHA256SUMS
          awk '{print $2}' _staging_v10/SHA256SUMS > /tmp/v10_files.txt
          git rm -r -q _staging_v10
          rm -rf _staging_v10
          git config user.name "dixonlj"
          git config user.email "dixonlj1993@gmail.com"
          xargs -a /tmp/v10_files.txt git add -f --
          git commit -q -m "Add draft v10 (analysis-plan re-analysis): m10 results and charts, scripts 37-44, Stanford replication, paper v10 sources/Word/PDF, journal plan, OSF note; README and .gitignore updated"
          git push
          git show --stat --format='%H' HEAD | tail -3
