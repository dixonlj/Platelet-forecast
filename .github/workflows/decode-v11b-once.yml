name: decode-v11b-once
on:
  push:
    branches: [main]
    paths: ['_staging_v11b/TARBALL.sha256']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild, verify, unpack and commit the v11b files
        run: |
          set -euo pipefail
          cd _staging_v11b
          cat release.b64.part* | base64 -d > release_v11b.tar.gz
          sha256sum -c TARBALL.sha256
          cd ..
          tar -xzf _staging_v11b/release_v11b.tar.gz
          sha256sum -c _staging_v11b/SHA256SUMS
          awk '{print $2}' _staging_v11b/SHA256SUMS > /tmp/v11b_files.txt
          git rm -r -q _staging_v11b
          rm -rf _staging_v11b
          git config user.name "dixonlj"
          git config user.email "dixonlj1993@gmail.com"
          xargs -a /tmp/v11b_files.txt git add -f --
          git commit -q -m "Draft v11: OSF DOI 10.17605/OSF.IO/PHQ42 swapped in (registered retrospectively 14 Nov 2026); add vancouver.csl, CITATION.cff and .zenodo.json; build runs from the repo alone; rebuilt v11 docx/pdf"
          git push
          git show --stat --format='%H' HEAD | tail -3
