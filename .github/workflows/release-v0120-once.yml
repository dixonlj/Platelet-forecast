name: release-v0120-once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-v0120-once.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove this one-shot workflow, then create release v0.12.0 on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "dixonlj"
          git config user.email "dixonlj1993@gmail.com"
          git rm -q .github/workflows/release-v0120-once.yml
          git commit -q -m "Remove one-shot release workflow"
          git push
          SHA=$(git rev-parse HEAD)
          cat > /tmp/notes.md <<'NOTES'
          Study 2 confirmatory results: national monthly platelet issues from NHS Blood and Transplant (England, April 2016 to October 2025).

          - **Pre-registered on OSF before the analysis was run:** https://osf.io/vrh2u/ (DOI [10.17605/OSF.IO/VRH2U](https://doi.org/10.17605/OSF.IO/VRH2U)).
          - **Result (null):** at one month ahead, ETS and SARIMA differed from a "same month last year" baseline by less than 1 unit/day on average (95% intervals about −6 to +4 units/day, against roughly 680 units/day issued), and the calendar regression was 7.8 units/day worse on average. Under the pre-registered rule, none of the three could be told apart from the baseline. Not being able to tell them apart is not proof that they are equal.
          - **Data:** the NHSBT spreadsheet is not included (no open licence), nor are output files containing its monthly values. Summary tables of errors and statistics are included.
          - Educational and advisory only: not clinical advice and not ordering advice for any hospital.
          - The analysis was drafted and reviewed with AI assistance; an AI review does not replace review by a human statistician or transfusion-medicine expert.

          Details: `study2/results/CONFIRMATORY_RESULTS_SUMMARY.md`.
          NOTES
          sed -i 's/^          //' /tmp/notes.md
          gh release create v0.12.0 --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "v0.12.0: Study 2 confirmatory results (NHSBT, null result)" \
            --notes-file /tmp/notes.md --latest
          gh release view v0.12.0 --repo "$GITHUB_REPOSITORY" --json url,tagName,targetCommitish,isDraft
